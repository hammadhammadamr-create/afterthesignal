<div class="relative">
  <button
    type="button"
    title="Language"
    data-popover-toggle
    [attr.aria-expanded]="popover.open() === 'lang'"
    (click)="toggle($event)"
    class="h-9 px-3 rounded-lg bg-space-card/90 border border-subtle hover:border-space-cyan/50 flex items-center gap-1.5 text-xs font-mono tracking-wider text-space-textMain transition-colors"
  >
    <svg
      class="w-3.5 h-3.5 text-space-cyan"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <circle cx="12" cy="12" r="10" />
      <path
        d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
      ></path>
    </svg>
    <span>{{ i18n.lang().toUpperCase() }}</span>
    <svg
      class="chevron w-3 h-3 text-space-textMuted"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
    </svg>
  </button>
  @if (popover.open() === 'lang') {
    <div
      data-popover="lang"
      class="absolute right-0 mt-2 w-36 bg-space-secondary border border-cyan-subtle rounded-lg shadow-xl py-1.5 z-50"
    >
      @for (l of languages; track l.code) {
        <button
          type="button"
          class="menu-option"
          [class.is-selected]="i18n.lang() === l.code"
          (click)="i18n.setLanguage(l.code)"
        >
          <span>{{ l.label }}</span><span class="dot">●</span>
        </button>
      }
    </div>
  }
</div>
