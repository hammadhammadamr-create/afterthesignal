<main
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-[#050914] px-5 py-16 text-white"
>
  <!-- Background effects -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -left-40 -top-40 size-96 rounded-full bg-cyan-500/10 blur-[120px]"></div>

    <div
      class="absolute -bottom-40 -right-40 size-96 rounded-full bg-blue-600/10 blur-[120px]"
    ></div>

    <div
      class="absolute inset-0 opacity-[0.08] [background-image:linear-gradient(rgba(255,255,255,.2)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,.2)_1px,transparent_1px)] [background-size:50px_50px]"
    ></div>
  </div>

  <section class="relative z-10 mx-auto w-full max-w-5xl">
    <!-- Header -->
    <div class="mb-12 text-center">
      <p class="font-mono text-xs tracking-[0.35em] text-cyan-400">AFTER THE SIGNAL</p>

      <h1 class="mt-5 font-display text-3xl font-bold uppercase tracking-wider sm:text-5xl">
        Choose Your Experience
      </h1>

      <p class="mx-auto mt-5 max-w-xl text-sm leading-7 text-slate-400 sm:text-base">
        Every explorer experiences the universe differently. Choose how you want to explore the
        forgotten missions.
      </p>
    </div>

    <!-- Options -->
    <div class="grid gap-5 md:grid-cols-3">
      <!-- Cadet -->
      <button
        type="button"
        (click)="selectMode('cadet')"
        class="group rounded-2xl border border-cyan-500/20 bg-slate-900/70 p-7 text-start transition-all duration-300 hover:-translate-y-2 hover:border-cyan-400/70 hover:bg-cyan-950/30 hover:shadow-[0_0_35px_rgba(34,211,238,0.12)]"
      >
        <span class="text-4xl">🚀</span>

        <h2 class="mt-6 text-xl font-bold text-white">Cadet</h2>

        <p class="mt-3 text-sm leading-7 text-slate-400">
          Start your journey with simple explanations, fascinating discoveries, and an easy
          introduction to space exploration.
        </p>

        <span class="mt-8 inline-flex items-center gap-2 text-sm font-semibold text-cyan-400">
          Start Exploring <span>→</span>
        </span>
      </button>

      <!-- All -->
      <button
        type="button"
        (click)="selectMode('all')"
        class="group rounded-2xl border border-blue-500/20 bg-slate-900/70 p-7 text-start transition-all duration-300 hover:-translate-y-2 hover:border-blue-400/70 hover:bg-blue-950/30 hover:shadow-[0_0_35px_rgba(59,130,246,0.12)]"
      >
        <span class="text-4xl">🌌</span>

        <h2 class="mt-6 text-xl font-bold text-white">All</h2>

        <p class="mt-3 text-sm leading-7 text-slate-400">
          Explore the complete experience with mission stories, discoveries, and historical
          information.
        </p>

        <span class="mt-8 inline-flex items-center gap-2 text-sm font-semibold text-blue-400">
          Start Exploring <span>→</span>
        </span>
      </button>

      <!-- Telemetry -->
      <button
        type="button"
        (click)="selectMode('telemetry')"
        class="group rounded-2xl border border-orange-500/20 bg-slate-900/70 p-7 text-start transition-all duration-300 hover:-translate-y-2 hover:border-orange-400/70 hover:bg-orange-950/20 hover:shadow-[0_0_35px_rgba(249,115,22,0.12)]"
      >
        <span class="text-4xl">🛰️</span>

        <h2 class="mt-6 text-xl font-bold text-white">Telemetry</h2>

        <p class="mt-3 text-sm leading-7 text-slate-400">
          Dive into technical details, mission data, scientific findings, and exploration records.
        </p>

        <span class="mt-8 inline-flex items-center gap-2 text-sm font-semibold text-orange-400">
          Start Exploring <span>→</span>
        </span>
      </button>
    </div>

    <p class="mt-10 text-center text-xs text-slate-500">
      You can change your experience later from Age Settings.
    </p>
  </section>
</main>
