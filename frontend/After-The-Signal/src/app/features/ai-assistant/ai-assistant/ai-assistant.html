<div class="fixed bottom-6 end-6 z-50 flex flex-col items-end">
  @if (isOpen()) {
    <section
      class="mb-4 flex w-[min(24rem,calc(100vw-2rem))] flex-col overflow-hidden rounded-2xl border border-blue-800/60 bg-slate-900 shadow-2xl"
      aria-label="NASA AI Companion"
    >
      <!-- Header -->
      <header
        class="flex items-center justify-between border-b border-blue-800/50 bg-blue-950 px-4 py-3"
      >
        <div class="flex items-center gap-2">
          <span class="size-2.5 animate-pulse rounded-full bg-blue-400"></span>
          <h2 class="text-sm font-semibold text-white">NASA AI Companion</h2>
        </div>

        <button
          type="button"
          (click)="toggleChat()"
          class="text-slate-400 transition-colors hover:text-white"
          aria-label="Close chat"
        >
          ✕
        </button>
      </header>

      <!-- Messages -->
      <div
        #messagesContainer
        class="flex h-72 flex-col gap-3 overflow-y-auto p-4 text-sm"
        aria-live="polite"
        aria-relevant="additions text"
      >
        @for (message of messages(); track message.id) {
          <div
            class="max-w-[85%] break-words rounded-xl p-3"
            [class.self-end]="message.sender === 'user'"
            [class.bg-blue-700]="message.sender === 'user'"
            [class.text-white]="message.sender === 'user'"
            [class.self-start]="message.sender === 'ai'"
            [class.bg-blue-950]="message.sender === 'ai'"
            [class.text-slate-200]="message.sender === 'ai'"
          >
            {{ message.text }}
          </div>
        }

        @if (isLoading()) {
          <div class="max-w-[85%] self-start rounded-xl bg-blue-950 p-3 text-slate-300">
            Thinking...
          </div>
        }
      </div>

      <!-- Input: هنضيف الإرسال في الخطوة التالية -->
      <div class="flex gap-2 border-t border-blue-900/40 bg-slate-950 p-3">
        <!-- Input Form -->
        <form
          class="flex gap-2 border-t border-blue-900/40 bg-slate-950 p-3"
          (submit)="
            $event.preventDefault(); sendMessage(messageInput.value); messageInput.value = ''
          "
        >
          <textarea
            #messageInput
            rows="1"
            placeholder="Ask me about space..."
            [disabled]="isLoading()"
            (keydown)="handleInputKeydown($event, messageInput)"
            class="min-w-0 flex-1 resize-none rounded-xl border border-blue-900/60 bg-slate-900 px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:border-blue-500 focus:outline-none"
          ></textarea>

          <button
            type="submit"
            [disabled]="isLoading()"
            class="rounded-xl bg-blue-800 px-3.5 py-2 text-sm font-medium text-white transition-colors hover:bg-blue-700 disabled:opacity-50"
          >
            {{ isLoading() ? 'Thinking...' : 'Ask' }}
          </button>
        </form>

        <button
          type="button"
          disabled
          class="rounded-xl bg-blue-800 px-3.5 py-2 text-sm font-medium text-white opacity-50"
        >
          Ask
        </button>
      </div>
    </section>
  }

  <!-- Floating Button -->
  <button
    type="button"
    (click)="toggleChat()"
    class="flex size-14 items-center justify-center rounded-full border border-blue-800/50 bg-blue-950 text-slate-200 shadow-lg transition-all hover:bg-blue-900 active:scale-95"
    [attr.aria-label]="isOpen() ? 'Close AI Companion' : 'Open AI Companion'"
    [attr.aria-expanded]="isOpen()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="currentColor"
      class="size-7"
      aria-hidden="true"
    >
      <path
        d="M7.5 2.5C7.5 5.2 5.2 7.5 2.5 7.5C5.2 7.5 7.5 9.8 7.5 12.5C7.5 9.8 9.8 7.5 12.5 7.5C9.8 7.5 7.5 5.2 7.5 2.5Z"
      />
      <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M17.2 5.8a2.4 2.4 0 0 1 3.4 3.4l-9.9 9.9a1 1 0 0 1-.7.3H7a1 1 0 0 1-1-1v-3a1 1 0 0 1 .3-.7l9.9-9.9Zm1.3 2.1-1.3-1.3-8.8 8.8v1.3h1.3l8.8-8.8Z"
      />
    </svg>
  </button>
</div>
